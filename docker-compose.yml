services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filings
      POSTGRES_PASSWORD: filings
      POSTGRES_DB: filingsiq
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
